name: Android build
on: [push, pull_request, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Restore validated Romanian corpus
        id: romanian-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/romanian-corpus
          key: romanian-corpus-v3-${{ hashFiles('tools/import_romanian_wiktionary.py') }}
      - name: Prepare offline Romanian corpus
        if: steps.romanian-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/romanian-corpus"
          mkdir -p "$dest"
          source="$RUNNER_TEMP/romanian-wiktionary.jsonl"
          url='https://kaikki.org/dictionary/Romanian/kaikki.org-dictionary-Romanian.jsonl'
          if ! curl --fail --location --retry 3 --max-time 600 "$url" -o "$source"; then
            source="$RUNNER_TEMP/raw-wiktionary.jsonl.gz"
            url='https://kaikki.org/dictionary/raw-wiktextract-data.jsonl.gz'
            curl --fail --location --retry 3 --max-time 1800 "$url" -o "$source"
          fi
          printf '%s\n' "$url" > "$dest/source.url"
          python3 tools/import_romanian_wiktionary.py "$source" "$dest/lexicon.jsonl"
          sha256sum "$source" | cut -d ' ' -f 1 > "$dest/source.sha256"
          cp tools/import_romanian_wiktionary.py "$dest/importer.py"
          printf '%s\n' 'English Wiktionary contributors via Kaikki/Wiktextract' 'https://kaikki.org/dictionary/Romanian/index.html' 'Derived lexical data: CC BY-SA 4.0' 'https://creativecommons.org/licenses/by-sa/4.0/' 'https://en.wiktionary.org/wiki/Wiktionary:Copyrights' 'Converted to JSONL; source links in each record.' > "$dest/ATTRIBUTION.txt"
      - name: Stage cached corpus for APK
        run: |
          set -euo pipefail
          dest=app/src/main/assets/ro_wiktionary
          mkdir -p "$dest"
          cp "$RUNNER_TEMP/romanian-corpus/"* "$dest/"
      - name: Validate packaged corpus
        run: |
          set -euo pipefail
          dest=app/src/main/assets/ro_wiktionary
          test -s "$dest/source.sha256"
          test -s "$dest/ATTRIBUTION.txt"
          python3 - "$dest/lexicon.jsonl" <<'PY'
          import json, sys
          words = set()
          with open(sys.argv[1], encoding="utf-8") as data:
              for line in data:
                  row = json.loads(line)
                  words.add(row["word"].casefold())
                  assert isinstance(row["english_glosses"], list)
                  assert isinstance(row["forms"], list)
                  assert isinstance(row["grammar"], list)
          if len(words) < 10000:
              raise SystemExit("Incomplete Romanian corpus")
          print(f"Validated {len(words)} distinct Romanian words")
          PY
      - name: Compress validated corpus before Android packaging
        run: |
          set -euo pipefail
          dest=app/src/main/assets/ro_wiktionary
          cp "$dest/source.sha256" "$dest/upstream.sha256"
          sha256sum "$dest/lexicon.jsonl" | cut -d ' ' -f 1 > "$dest/source.sha256"
          gzip -n -6 "$dest/lexicon.jsonl"
          gzip -t "$dest/lexicon.jsonl.gz"
          ls -lh "$dest/lexicon.jsonl.gz"
          test "$(gzip -dc "$dest/lexicon.jsonl.gz" | sha256sum | cut -d ' ' -f 1)" = "$(cat "$dest/source.sha256")"
      - name: Install Vulkan build dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu runners may not expose universe packages by default.
          # Install reproducible build tools from a supported Ubuntu repository.
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc libvulkan-dev spirv-headers
          command -v glslc
          dpkg-query -W glslc libvulkan-dev spirv-headers
          config="$(find /usr -type f \( -name 'SPIRV-HeadersConfig.cmake' -o -name 'spirv-headers-config.cmake' \) -print -quit 2>/dev/null || true)"
          if [[ -z "$config" ]]; then
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/SPIRV-Headers"
            cmake -S "$RUNNER_TEMP/SPIRV-Headers" -B "$RUNNER_TEMP/SPIRV-Headers-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/spirv-headers-install" -DSPIRV_HEADERS_ENABLE_TESTS=OFF
            cmake --build "$RUNNER_TEMP/SPIRV-Headers-build"
            cmake --install "$RUNNER_TEMP/SPIRV-Headers-build"
            config="$(find "$RUNNER_TEMP/spirv-headers-install" -type f \( -name 'SPIRV-HeadersConfig.cmake' -o -name 'spirv-headers-config.cmake' \) -print -quit)"
          fi
          test -n "$config"
          test -f "$config"
          echo "XILON_SPIRV_HEADERS_DIR=$(dirname "$config")" >> "$GITHUB_ENV"
          echo "SPIRV-Headers CMake package: $config"
          test -f "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan.h"
          # Android NDK provides vulkan.h but not necessarily the Vulkan-Hpp C++ wrapper.
          # Stage the complete Khronos header directory; never mix individual header versions.
          test -s /usr/include/vulkan/vulkan.hpp
          mkdir -p "$RUNNER_TEMP/xilon-vulkan-sdk/include"
          cp -a /usr/include/vulkan "$RUNNER_TEMP/xilon-vulkan-sdk/include/"
          # Vulkan video codec headers live beside vulkan/, not inside it.
          # ggml-vulkan includes them transitively through vulkan_core.h.
          if [ -d /usr/include/vk_video ]; then
            cp -a /usr/include/vk_video "$RUNNER_TEMP/xilon-vulkan-sdk/include/"
          fi
          if [ ! -s "$RUNNER_TEMP/xilon-vulkan-sdk/include/vk_video/vulkan_video_codec_av1std.h" ]; then
            git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/Vulkan-Headers"
            cp -a "$RUNNER_TEMP/Vulkan-Headers/include/vulkan/." "$RUNNER_TEMP/xilon-vulkan-sdk/include/vulkan/"
            cp -a "$RUNNER_TEMP/Vulkan-Headers/include/vk_video" "$RUNNER_TEMP/xilon-vulkan-sdk/include/"
          fi
          test -s "$RUNNER_TEMP/xilon-vulkan-sdk/include/vulkan/vulkan_core.h"
          test -s "$RUNNER_TEMP/xilon-vulkan-sdk/include/vk_video/vulkan_video_codec_av1std.h"
          # Cross-compiling against the Android NDK requires explicit SPIR-V includes.
          test -s /usr/include/spirv/unified1/spirv.hpp
          cp -a /usr/include/spirv "$RUNNER_TEMP/xilon-vulkan-sdk/include/"
          test -s "$RUNNER_TEMP/xilon-vulkan-sdk/include/spirv/unified1/spirv.hpp"
          echo "XILON_VULKAN_HEADERS_INCLUDE=$RUNNER_TEMP/xilon-vulkan-sdk/include" >> "$GITHUB_ENV"
          glslc --version
      - name: Verify native Vulkan toolchain before Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -s "$XILON_VULKAN_HEADERS_INCLUDE/vulkan/vulkan.hpp"
          test -s "$XILON_VULKAN_HEADERS_INCLUDE/vk_video/vulkan_video_codec_av1std.h"
          test -s "$XILON_VULKAN_HEADERS_INCLUDE/spirv/unified1/spirv.hpp"
          test -f "$XILON_SPIRV_HEADERS_DIR/SPIRV-HeadersConfig.cmake" || test -f "$XILON_SPIRV_HEADERS_DIR/spirv-headers-config.cmake"
          command -v glslc
      - name: Test and build unified JARVIS APK (VLM + Vulkan)
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug -PenableVlm=true -PenableVulkan=true --stacktrace
          test "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: xilon-jarvis-unified-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Verify APK signatures and record checksums
        run: |
          set -euo pipefail
          mkdir -p validation
          for apk in app/build/outputs/apk/debug/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            sha256sum "$apk" >> validation/apk-sha256.txt
          done
          git rev-parse HEAD > validation/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xilon-apk-validation
          path: validation/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xilon-jarvis-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

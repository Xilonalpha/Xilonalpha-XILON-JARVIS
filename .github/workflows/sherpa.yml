name: Sherpa Android validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/sherpa/**'
      - 'app/build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/sherpa.yml'
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - run: gradle :app:testDebugUnitTest :app:assembleDebug -PenableSherpa=true --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: xilon-jarvis-full-sherpa-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
